name: Feature
description: Propose a scoped capability
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: textarea
    id: objective
    attributes: { label: Objective, description: State the user outcome. }
    validations: { required: true }
  - type: textarea
    id: scope
    attributes: { label: Scope and exclusions }
    validations: { required: true }
  - type: textarea
    id: acceptance
    attributes: { label: Acceptance criteria, description: Use observable outcomes. }
    validations: { required: true }
  - type: textarea
    id: tests
    attributes: { label: Test requirements }
    validations: { required: true }
